<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>openui blocks · 预览</title>
<link rel="stylesheet" href="./vendor/design-platform.css" />
<link rel="stylesheet" href="./vendor/gradient-shadow-text.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--dsw-alias-bg-base, #fff); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    color: var(--dsw-alias-label-primary, #16181d);
    padding: 44px 24px 72px;
  }
  .demo-page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 34px; }
  body[data-narrow] .demo-page { max-width: 390px; }
  .demo-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .demo-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .demo-sub { font-size: 12px; color: var(--dsw-alias-label-tertiary, #8a919e); margin-top: 3px; }
  .demo-toggle { display: flex; gap: 4px; flex: none; }
  .demo-toggle button { white-space: nowrap; }
  .demo-toggle button {
    font: inherit; font-size: 12px; line-height: 18px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1));
    background: transparent; color: var(--dsw-alias-label-secondary, #5b6270);
  }
  .demo-toggle button[data-active] {
    color: var(--dsw-alias-label-primary, #16181d);
    border-color: color-mix(in srgb, var(--dsw-alias-label-tertiary, #8a919e) 45%, transparent);
  }
  .demo { display: flex; flex-direction: column; gap: 10px; }
  .demo-caption { font-size: 11.5px; color: var(--dsw-alias-label-tertiary, #8a919e); letter-spacing: 0.01em; }
  .demo-surface {
    border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1));
    border-radius: 14px;
    padding: 18px 20px;
    background: var(--dsw-alias-bg-base, #fff);
  }
  .demo-broken { font-size: 12px; overflow-x: auto; color: var(--dsw-alias-state-error-primary, #d13b3b); }
</style>
</head>
<body>
<div id="root"></div>
<script src="./bundle.js"></script>
</body>
</html>
