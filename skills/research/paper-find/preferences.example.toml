# Copy to preferences.toml and adjust. preferences.toml is gitignored.
# Never put a key in this file.

[pwc]
# MCP server name as registered in your harness
server = "pwc"

[alphaxiv]
server = "alphaxiv"
# Export this variable in the shell that starts the harness.
# Only the name lives here; the value stays out of git.
env_var = "ALPHAXIV_API_KEY"
