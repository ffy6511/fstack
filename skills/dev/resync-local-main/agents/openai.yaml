interface:
  display_name: "resync local main"
  short_description: "把本地未推送的提交重放到远端最新提交之上，带备份与校验"
  default_prompt: "Use $resync-local-main in the worktree that has main checked out: fetch origin, then replay my unpushed main commits on top of origin/main. Resolve conflicts if needed and do not push."
