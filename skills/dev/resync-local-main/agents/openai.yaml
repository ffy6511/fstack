interface:
  display_name: "resync local main"
  short_description: "把分支的改动在本地 main 上重新提交并迁走未提交改动；源分支提交不动，默认不 push"
  default_prompt: "Use $resync-local-main. First determine the direction: when I say to resync branch A onto local main, fetch origin/main, fast-forward main when possible, and when main has diverged replay its local unpushed commits as new commits onto origin/main. Then replay A's unique commits as new commits on a temporary branch: keep the message and author, but set author date and committer date to now so the replayed commits are the newest on main. Leave A's own commits and hashes unchanged, and move A's uncommitted and untracked changes into the main worktree so A ends clean. Verify each replay by patch-id, including the explicit zero-commit case. When I say to resync the current branch, replay its unpushed commits onto its own upstream the same way. Do not rebase and do not cherry-pick. Back up before rewriting, resolve conflicts only when I confirm, and do not push."
